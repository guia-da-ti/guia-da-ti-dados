name: Atualizar o site
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar build do site
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SITE_REPOSITORY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'guia-da-ti',
              repo: 'guia-da-ti',
              event_type: 'catalog-updated',
              client_payload: { catalog_sha: context.sha },
            });
            core.notice(`Build solicitado para a atualização do catálogo ${context.sha}.`);
