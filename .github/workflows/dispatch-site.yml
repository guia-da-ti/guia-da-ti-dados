name: Atualizar o site
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar build do site
        uses: actions/github-script@v7
        env:
          SITE_REPOSITORY_DISPATCH_TOKEN: ${{ secrets.SITE_REPOSITORY_DISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.SITE_REPOSITORY_DISPATCH_TOKEN;
            if (!token) {
              core.setFailed('Configure o segredo SITE_REPOSITORY_DISPATCH_TOKEN neste repositório para solicitar o build do site.');
              return;
            }

            const site = github.getOctokit(token);
            await site.rest.repos.createDispatchEvent({
              owner: 'guia-da-ti',
              repo: 'guia-da-ti',
              event_type: 'catalog-updated',
              client_payload: { catalog_sha: context.sha },
            });
            core.notice(`Build solicitado para a atualização do catálogo ${context.sha}.`);
